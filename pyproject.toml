[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501: lineas largas toleradas (convencion del repo)
# F841: variables asignadas por efecto/legibilidad (tests y prod)
# E741: nombres ambiguos tipo `l` en codigo legacy
# E701: one-liners compactos (estilo del repo)
ignore = ["E501", "F841", "E741", "E701"]

[tool.ruff.lint.per-file-ignores]
# Imports lazy a mitad de archivo (arranque rapido del servidor):
"python/main.py" = ["E402"]
"python/modules/referencias_module.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
