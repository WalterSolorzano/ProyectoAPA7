name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Python dependencies
      run: pip install -r requirements.txt pyinstaller

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    # electron:build = embed_payload → pyinstaller (spec con excludes de peso)
    #                    → tsc+vite+manifest → electron-builder
    # electron-builder YA publica el release (.exe + latest.yml + blockmap).
    # NO agregar pasos extra de upload (softprops) o se crea un release duplicado
    # sin latest.yml y el auto-update falla.
    - name: Build backend + frontend + Electron
      run: npm run electron:build -- --publish always
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
