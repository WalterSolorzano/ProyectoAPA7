name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ── LINT ──────────────────────────────────────────────────────────────────
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Ruff
      run: pip install ruff
    - name: Run Ruff Linter
      run: ruff check python/

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci
    - name: Run ESLint
      run: npx eslint src/

  # ── TESTS ─────────────────────────────────────────────────────────────────
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-timeout
    - name: Generate test corpus documents
      run: cd python && python tests/generate_test_docs.py
    - name: Run pytest
      run: cd python && python -m pytest tests/ -v --tb=short --timeout=120 -p no:warnings
      env:
        PYTHONPATH: python

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci
    - name: Run vitest
      run: npx vitest run

  # ── CORPUS REGRESSION ─────────────────────────────────────────────────────
  corpus-regression:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-timeout
    - name: Generate test corpus documents
      run: cd python && python tests/generate_test_docs.py
    - name: Run corpus regression tests
      run: cd python && python -m pytest tests/test_corpus.py -v --tb=long --timeout=180 -p no:warnings
      env:
        PYTHONPATH: python
