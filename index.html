<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WordAPA7 — Formatea documentos Word a APA 7 con precisión y control total" />
    <title>WordAPA7</title>
    <style>
      #wordapa7-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      #wordapa7-splash.is-done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .splash-doc {
        width: 64px;
        height: 78px;
        position: relative;
        animation: splash-bob 1.6s ease-in-out infinite;
      }
      .splash-doc .page {
        position: absolute;
        inset: 0;
        background: #ffcc80;
        border: 2px solid #e65100;
        border-radius: 6px;
      }
      .splash-doc .fold {
        position: absolute;
        top: 0;
        right: 0;
        width: 16px;
        height: 16px;
        border-bottom-left-radius: 6px;
        background: #ffe0b2;
        border-left: 2px solid #e65100;
        border-bottom: 2px solid #e65100;
      }
      .splash-doc .line {
        position: absolute;
        left: 12px;
        right: 12px;
        height: 3px;
        border-radius: 2px;
        background: #e65100;
        opacity: 0.35;
      }
      .splash-doc .line1 { top: 22px; }
      .splash-doc .line2 { top: 30px; right: 24px; }
      .splash-doc .line3 { top: 38px; right: 30px; }
      .splash-eyes {
        position: absolute;
        top: 46px;
        left: 16px;
        right: 16px;
        display: flex;
        justify-content: space-between;
      }
      .splash-eyes span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #4e342e;
      }
      .splash-smile {
        position: absolute;
        left: 22px;
        right: 22px;
        top: 56px;
        height: 6px;
        border-bottom: 2.5px solid #4e342e;
        border-radius: 0 0 8px 8px;
      }
      .splash-name {
        font-size: 22px;
        font-weight: 800;
        color: #1a1a2e;
        letter-spacing: -0.01em;
      }
      .splash-name span {
        color: #4f7cff;
      }
      .splash-tag {
        font-size: 12px;
        color: #6b7280;
        margin-top: -12px;
      }
      .splash-dots {
        display: flex;
        gap: 6px;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4f7cff;
        animation: splash-dot 1.1s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }
      @keyframes splash-dot {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
        30% { transform: translateY(-5px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="wordapa7-splash" role="status" aria-label="Cargando WordAPA7">
        <div class="splash-doc" aria-hidden="true">
          <div class="page"></div>
          <div class="fold"></div>
          <div class="line line1"></div>
          <div class="line line2"></div>
          <div class="line line3"></div>
          <div class="splash-eyes"><span></span><span></span></div>
          <div class="splash-smile"></div>
        </div>
        <div class="splash-name">WordAPA<span>7</span></div>
        <div class="splash-tag">Formateando tu documento a APA 7</div>
        <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
