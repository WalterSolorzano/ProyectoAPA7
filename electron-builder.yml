appId: com.wordapa7.app
productName: WordAPA7
disableSanityCheckAsar: true
directories:
  output: dist-electron-builder
  buildResources: build
electronDist: electron-dist
files:
  - dist/**/*
  - dist-electron/**/*
extraResources:
  - from: dist-python/
    to: python-backend/
    filter:
      - "**/*"
  - from: word-addin/dist/
    to: addin/
    filter:
      - "**/*"
  - from: word-addin/manifest.xml
    to: addin/manifest.xml
compression: store
win:
  target: nsis
  icon: build/icon.ico
  signExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  perMachine: false
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  include: build/installer.nsh
publish:
  provider: github
  owner: WalterSolorzano
  repo: ProyectoAPA7
  releaseType: release
